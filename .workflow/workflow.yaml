name: xyzTaskFlow

pollIntervalSeconds: 15

tasks:
  type: jira
  config:
    query: project = ABCD
    issueTypes: [Task]
    assigneeIsAgent: true

runner:
  type: orca

closeOn: [done]

nodes:
  coding:
    agent: build
    when: "In Progress"
    onSuccess: reviewing
    onFailure: coding
    nudgePrompt: "Ticket {{ticket}} is back at 'coding'. Read the latest feedback and continue. End with STATUS/SUMMARY."

  reviewing:
    agent: build
    when: "In Review"
    onSuccess: done
    onFailure: coding

  done:
    when: "Done"
