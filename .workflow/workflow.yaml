pollIntervalSeconds: 15

workflows:
  taskDevelopment:
    jql: project = xyz AND issuetype = Task
    closeOn:
      - Done
    agents:
      plan:
        handles:
          - "Ready for dev"
        outcomes:
          done: "In Progress"
          blocked: Blocked
        nudgePrompt: "Ticket {{ticket}} is back in '{{status}}'. Run `acli jira workitem view {{ticket}} --fields summary,description,comment --json` to read the latest feedback and revise the plan. End with STATUS/SUMMARY as before."

      build:
        handles:
          - "In Progress"
        outcomes:
          done: "In Review"
          blocked: "Ready for dev"

  incidentResponse:
    jql: project = xyz AND issuetype = Incident
    closeOn:
      - Done
    agents:
      investigate:
        handles:
          - "In Progress"
        outcomes:
          done: "In Review"
          blocked: Blocked
