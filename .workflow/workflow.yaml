name: xyzTaskFlow
assigneeIsAgent: true

pollIntervalSeconds: 15

workflows:
  taskDevelopment:
    jql: project = xyz
    issueTypes: [Task]
    closeOn:
      - Done
    agents:
      plan:
        handles:
          - status: "Ready for dev"
            outcomes:
              done: "In Progress"
              blocked: "Ready for dev"
          - status: "In Review"
            outcomes:
              done: Done
              blocked: "Ready for dev"
        nudgePrompt: "Ticket {{ticket}} is back in '{{status}}'. Run `acli jira workitem view {{ticket}} --fields summary,description,comment --json` to read the latest feedback and revise the plan. End with STATUS/SUMMARY as before."

      build:
        handles:
          - status: "In Progress"
            outcomes:
              done: "In Review"
              blocked: "Ready for dev"

  incidentResponse:
    jql: project = xyz
    issueTypes: [Incident]
    closeOn:
      - Done
    agents:
      investigate:
        handles:
          - status: "In Progress"
            outcomes:
              done: "In Review"
              blocked: "In Progress"
