version: 2
project_name: relayflow
builds:
  - id: relayflow
    main: ./cmd/relayflow
    binary: relayflow
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
brews:
  - name: relayflow
    repository:
      owner: rajpopat27
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/rajpopat27/relayflow
    description: "Graph-based agent workflow engine"
    install: |
      bin.install "relayflow"
    test: |
      system "#{bin}/relayflow", "--help"
release:
  github:
    owner: rajpopat27
    name: relayflow
