<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>v4 Workflow Engine — Animated</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f1420; color: #e6e9f0; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 20px; }
  .controls { margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button.sec { background: #374151; }
  button:hover { filter: brightness(1.15); }
  .lane { display: flex; gap: 14px; align-items: stretch; margin-bottom: 18px; flex-wrap: wrap; }
  .box { background: #1a2233; border: 1px solid #2b3550; border-radius: 10px; padding: 10px 12px; min-width: 150px; }
  .box h3 { font-size: 12px; color: #8b93a7; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .node { background: #14213d; border: 2px solid #2b4a8b; border-radius: 8px; padding: 8px 10px; margin: 6px 0; position: relative; min-height: 52px; transition: border-color .3s; }
  .node .nm { font-weight: 600; font-size: 14px; }
  .node .ag { font-size: 11px; color: #9db4e8; }
  .node.terminal { border-color: #3f6212; background: #16240f; }
  .node.active { border-color: #f59e0b; box-shadow: 0 0 12px #f59e0b55; }
  .ticket { position: absolute; top: -10px; right: -8px; background: #f59e0b; color: #111; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; transition: all .8s cubic-bezier(.4,0,.2,1); z-index: 5; white-space: nowrap; }
  .ticket.claimed { background: #10b981; }
  .log { background: #0a0e18; border: 1px solid #2b3550; border-radius: 10px; padding: 10px 12px; height: 220px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.6; }
  .log .t { color: #6b7280; }
  .log .ok { color: #10b981; } .log .err { color: #ef4444; } .log .info { color: #60a5fa; }
  .wfwrap { border: 1px dashed #2b3550; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .wftitle { font-size: 13px; color: #c4b5fd; margin-bottom: 8px; font-weight: 600; }
  .badge { display:inline-block; background:#2b3550; border-radius:4px; padding:1px 6px; font-size:10px; margin-left:6px; color:#9db4e8;}
  #stage { position: relative; }
</style>
</head>
<body>
<h1>v4 Workflow Engine — animated walkthrough</h1>
<div class="sub">Token = ticket. Squares = nodes (each with an agent). Robots report success/failure → token moves. Jira is just the scoreboard. Labels (<span class="badge">wf:name</span>) = mutex across workflows.</div>

<div class="controls">
  <button onclick="resetAll()">⟲ Reset</button>
  <button class="sec" onclick="runSingle()">▶ Single workflow (GHCOS-1)</button>
  <button class="sec" onclick="runMulti()">▶ Two workflows + collision</button>
  <button class="sec" onclick="runRestart()">▶ Crash + restart (bounce)</button>
  <button class="sec" onclick="runInternals()">▶ Server internals (Jira → Orca)</button>
</div>

<style>
  .pipe { display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; }
  .pbox { background:#101828; border:1px solid #2b3550; border-radius:8px; padding:8px 10px; min-width:170px; flex:1; }
  .pbox h4 { font-size:11px; color:#7dd3fc; text-transform:uppercase; margin-bottom:6px; }
  .pbox .step { font-size:12px; padding:4px 6px; border-radius:5px; margin:3px 0; background:#182238; opacity:.35; transition:all .3s; }
  .pbox .step.on { opacity:1; background:#1e3a5f; box-shadow:0 0 8px #38bdf855; }
  .pbox .step.ok { opacity:1; background:#14532d; }
  .pbox .step.err { opacity:1; background:#4c1d1d; }
  .pkt { display:inline-block; background:#38bdf8; color:#04121f; font-weight:700; font-size:11px; border-radius:8px; padding:2px 8px; margin-right:6px; }
</style>

<div id="stage"></div>
<h3 style="font-size:13px;color:#8b93a7;margin-bottom:6px;">SERVER LOG</h3>
<div class="log" id="log"></div>

<script>
const NODES = {
  coding:        {agent:'coder',    x:'coding'},
  inReview:     {agent:'reviewer', x:'inReview'},
  
  done:         {agent:null,    x:'done', terminal:true},
};
const EDGES = {
  coding:   {success:'inReview', failure:'coding'},
  inReview: {success:'done',     failure:'coding'},
};
// second workflow (incident response) shares tracker states
const NODES2 = { fixing:{agent:'coder'}, resolved:{agent:null,terminal:true} };
const EDGES2 = { fixing:{success:'resolved', failure:'fixing'} };

const stage = document.getElementById('stage');
const logEl = document.getElementById('log');
let timer = 0;

function log(msg, cls='info') {
  const d = document.createElement('div');
  d.innerHTML = `<span class="t">[+${(timer*0.9).toFixed(1)}s]</span> <span class="${cls}">${msg}</span>`;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function wait(s){ return new Promise(r=>setTimeout(r, s*900)); }

function buildWorkflow(id, title, nodes, tickets=[]) {
  const wrap = document.createElement('div');
  wrap.className='wfwrap'; wrap.id=id;
  wrap.innerHTML = `<div class="wftitle">${title}</div><div class="lane" id="${id}-lane"></div>`;
  const lane = wrap.querySelector('.lane');
  for (const [name, n] of Object.entries(nodes)) {
    const div = document.createElement('div');
    div.className = 'node' + (n.terminal?' terminal':'');
    div.id = `${id}-node-${name}`;
    div.innerHTML = `<div class="nm">${name}</div><div class="ag">${n.agent? 'agent: '+n.agent : 'terminal'}</div>`;
    lane.appendChild(div);
  }
  stage.appendChild(wrap);
  for (const t of tickets) spawnTicket(id, t.key, t.node, t.claimedBy);
}

function spawnTicket(wfId, key, node, claimedBy=null) {
  const nodeEl = document.getElementById(`${wfId}-node-${node}`);
  const tk = document.createElement('div');
  tk.className = 'ticket' + (claimedBy? ' claimed':'');
  tk.id = `tk-${wfId}-${key}`;
  tk.textContent = key + (claimedBy? ` 🔒${claimedBy}`:'');
  tk.dataset.node = node; tk.dataset.claim = claimedBy||'';
  nodeEl.appendChild(tk);
}

function moveTicket(wfId, key, toNode, claimLabel) {
  return new Promise(res => {
    const tk = document.getElementById(`tk-${wfId}-${key}`);
    const target = document.getElementById(`${wfId}-node-${toNode}`);
    tk.dataset.node = toNode;
    if (claimLabel !== undefined) {
      tk.dataset.claim = claimLabel;
      tk.classList.toggle('claimed', !!claimLabel);
      tk.textContent = key + (claimLabel? ` 🔒${claimLabel}`:'');
    }
    target.appendChild(tk); // CSS transition via reparent + FLIP-lite
    tk.style.transition='none'; tk.style.transform='translateY(-14px)';
    requestAnimationFrame(()=>{ tk.style.transition='all .8s cubic-bezier(.4,0,.2,1)'; tk.style.transform='translateY(0)'; });
    setTimeout(res, 850);
  });
}

function flash(wfId, node) {
  const el = document.getElementById(`${wfId}-node-${node}`);
  el.classList.add('active'); setTimeout(()=>el.classList.remove('active'), 1200);
}

async function agentCycle(wfId, wfName, key, node, edges, outcomeSeq) {
  for (const outcome of outcomeSeq) {
    flash(wfId, node);
    log(`poll[${wfName}]: ${key} at node <b>${node}</b> → spawn terminal <i>${key}:${NODES[node]?.agent||'coder'}:${node}</i>`, 'info');
    await wait(1);
    log(`plugin: ${key} → POST /report {outcome: ${outcome}}`, outcome==='success'?'ok':'err');
    await wait(.6);
    const next = edges[node][outcome];
    if (next === node) {
      log(`jira adapter: self-loop on ${node} → comment only, no transition`, 'info');
      await moveTicket(wfId, key, node);
    } else {
      log(`jira adapter: transition ${key} → trackerMap[${next}] <span class="ok">✓</span>`, 'ok');
      await moveTicket(wfId, key, next);
    }
    await wait(.5);
    node = next;
    if (!edges[node]) { log(`${key}: terminal node <b>${node}</b> → closeOn, workflow done <span class="ok">■</span>`, 'ok'); return; }
  }
}

async function runSingle() {
  resetAll();
  log('submit xyzFlow.yaml → server starts poll goroutine', 'info');
  buildWorkflow('wf1', 'workflow: xyzFlow <span class="badge">tracker: jira</span>', NODES, [{key:'GHCOS-1', node:'coding'}]);
  await wait(1);
  log('poll tick: List() → GHCOS-1 unclaimed → Claim() → label wf:xyzFlow', 'ok');
  await moveTicket('wf1','GHCOS-1','coding','wf:xyzFlow');
  await agentCycle('wf1','xyzFlow','GHCOS-1','coding',EDGES,['success','failure','success','success']);
}

async function runMulti() {
  resetAll();
  log('submit TWO workflows sharing one Jira project', 'info');
  buildWorkflow('wf1','workflow: xyzFlow <span class="badge">jira</span>', NODES, [{key:'GHCOS-1',node:'coding'},{key:'GHCOS-2',node:'coding'}]);
  buildWorkflow('wf2','workflow: incidentFlow <span class="badge">jira, same project</span>', NODES2, []);
  await wait(1);
  log('wf1 claims GHCOS-1 (label wf:xyzFlow)', 'ok');
  await moveTicket('wf1','GHCOS-1','coding','wf:xyzFlow');
  log('incidentFlow List() also matches GHCOS-1 → sees label wf:xyzFlow ≠ wf:incidentFlow → <b>skip</b>', 'err');
  await wait(1.2);
  log('GHCOS-2 unclaimed → claim + dispatch concurrently (goroutine per ticket)', 'ok');
  await moveTicket('wf1','GHCOS-2','coding','wf:xyzFlow');
  agentCycle('wf1','xyzFlow','GHCOS-1','coding',EDGES,['success','success','success']);
  await agentCycle('wf1','xyzFlow','GHCOS-2','coding',EDGES,['failure','success','success','success']);
}

async function runRestart() {
  resetAll();
  buildWorkflow('wf1','workflow: xyzFlow <span class="badge">jira</span>', NODES, [{key:'GHCOS-1',node:'coding'}]);
  log('claim + spawn, agent working…', 'ok');
  await moveTicket('wf1','GHCOS-1','coding','wf:xyzFlow');
  await wait(1);
  log('💥 SERVER CRASH — in-memory claimed set lost; label wf:xyzFlow survives in Jira', 'err');
  await wait(1);
  log('restart → resubmit yaml → poll goroutine back', 'info');
  await wait(1);
  log('List() returns GHCOS-1 with ClaimedBy=wf:xyzFlow (mine!) but not in memory → <b>bounce</b>: reuse terminal, nudge session', 'ok');
  flash('wf1','coding');
  await wait(1.2);
  log('agent re-reports success → transition proceeds — self-healed, no human', 'ok');
  await agentCycle('wf1','xyzFlow','GHCOS-1','coding',EDGES,['success','success','success']);
}

const INTERNAL_STEPS = [
  {id:'jql',   h:'① Jira adapter: List()', steps:[
    'build JQL: (query) + issuetype + component + assignee',
    'acli jira workitem search --jql … --json',
    'for each ticket: status → node via trackerMap',
    'read labels → ClaimedBy field']},
  {id:'sort',  h:'② Daemon: per-ticket switch', steps:[
    'ClaimedBy = other workflow → skip',
    'ClaimedBy = me + not in memory → bounce',
    'unclaimed → go dispatch() (new goroutine)']},
  {id:'disp',  h:'③ dispatch goroutine', steps:[
    'Claim(t) → add label wf:<name> in Jira',
    'orca worktree create <repo>/<key>',
    'orca terminal spawn, title KEY:agent:node',
    'inject env: ORCA_WF_WORKFLOW/TICKET/NODE']},
  {id:'agent', h:'④ OpenCode session', steps:[
    'agent runs (MCPs, tools, edits…)',
    'ends turn with STATUS/SUMMARY block',
    'session.idle → plugin wakes']},
  {id:'rep',   h:'⑤ Report loopback', steps:[
    'plugin → orca-wf report (unix socket)',
    'server /report → route by workflow name',
    'tracker.Report: outcome→edge→targetNode',
    'Jira: transition + comment (self-loop = comment)']},
];

async function runInternals() {
  resetAll();
  const wrap = document.createElement('div');
  wrap.className='wfwrap';
  wrap.innerHTML = `<div class="wftitle">inside the server — one poll tick, one ticket</div><div class="pipe" id="pipe"></div>`;
  stage.appendChild(wrap);
  const pipe = wrap.querySelector('#pipe');
  for (const col of INTERNAL_STEPS) {
    const d = document.createElement('div');
    d.className='pbox';
    d.innerHTML = `<h4>${col.h}</h4>` + col.steps.map((s,i)=>`<div class="step" id="st-${col.id}-${i}">${s}</div>`).join('');
    pipe.appendChild(d);
  }
  const mark = async (col, i, cls='on', t=.7) => {
    const el = document.getElementById(`st-${col}-${i}`);
    el.classList.add(cls); log(el.textContent, cls==='err'?'err':cls==='ok'?'ok':'info');
    await wait(t);
  };
  log('poll tick (every 15s, per-workflow goroutine)', 'info'); await wait(.6);
  for (let i=0;i<4;i++) await mark('jql', i, 'on');
  document.getElementById('st-jql-3').classList.replace('on','ok');
  log('→ [GHCOS-1 status="To Do" → node=coding, ClaimedBy=""]', 'ok'); await wait(.5);
  await mark('sort',0,'err'); await mark('sort',1,'err'); await mark('sort',2,'ok');
  for (let i=0;i<4;i++) await mark('disp', i, i===0?'ok':'on');
  log('terminal GHCOS-1:coder:coding alive — dispatch goroutine exits', 'info'); await wait(.6);
  for (let i=0;i<3;i++) await mark('agent', i, 'on');
  document.getElementById('st-agent-2').classList.replace('on','ok'); await wait(.4);
  for (let i=0;i<4;i++) await mark('rep', i, 'on');
  document.getElementById('st-rep-3').classList.replace('on','ok');
  log('GHCOS-1 → Jira status "In Review" (node inReview). Next tick picks it up again <span class="ok">✓</span>', 'ok');
}

function resetAll(){ stage.innerHTML=''; logEl.innerHTML=''; timer=0; }
</script>
</body>
</html>
